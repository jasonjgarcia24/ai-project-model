# --- Risks ---
risks:
  - risk_id: "R-001"
    description: "Insufficient labeled training data for new product lines"
    category: "Data"
    likelihood: 3
    impact: 4
    mitigation: "Prioritize labeling for new product lines in Phase 2; engage domain SMEs for label review"
    owner: "Priya Sharma"
    status: "Mitigating"
    date_identified: "2026-03-03"
    date_resolved: ""
  - risk_id: "R-002"
    description: "Language bias leading to lower accuracy for non-English tickets"
    category: "RAI"
    likelihood: 4
    impact: 4
    mitigation: "Stratified evaluation by language; multilingual training data augmentation; Facets audit"
    owner: "David Kim"
    status: "Open"
    date_identified: "2026-03-03"
    date_resolved: ""
  - risk_id: "R-003"
    description: "Agent resistance to AI-assisted triage"
    category: "Resource"
    likelihood: 3
    impact: 3
    mitigation: "Early agent involvement in design (Phase 3); pilot with volunteer team; transparent override metrics"
    owner: "Aisha Patel"
    status: "Mitigating"
    date_identified: "2026-03-03"
    date_resolved: ""
  - risk_id: "R-004"
    description: "P1 ticket misclassification causing delayed response to critical issues"
    category: "Technical"
    likelihood: 2
    impact: 4
    mitigation: "P1/P2 tickets require human confirmation; fallback to manual triage if confidence < 0.8"
    owner: "James Okafor"
    status: "Open"
    date_identified: "2026-03-03"
    date_resolved: ""
  - risk_id: "R-005"
    description: "Inference latency exceeds 500ms P95 target under peak load"
    category: "Technical"
    likelihood: 2
    impact: 3
    mitigation: "Load testing in Phase 4; model distillation as fallback; auto-scaling serving infrastructure"
    owner: "James Okafor"
    status: "Open"
    date_identified: "2026-04-14"
    date_resolved: ""
  - risk_id: "R-006"
    description: "PII leakage through model training artifacts"
    category: "RAI"
    likelihood: 2
    impact: 5
    mitigation: "PII masking pipeline in data preprocessing; no raw text in model checkpoints; automated PII scan"
    owner: "Priya Sharma"
    status: "Mitigating"
    date_identified: "2026-03-17"
    date_resolved: ""

# --- Decisions ---
decisions:
  - id: "DEC-001"
    title: "AI approach: human-in-the-loop"
    description: "Determine the automation level for ticket triage"
    options_considered: "Full automation, human-in-the-loop, hybrid"
    decision: "Human-in-the-loop for P1/P2; auto-route P3/P4 above confidence threshold"
    rationale: "P1/P2 tickets carry high business risk; agent oversight reduces misclassification impact"
    maker: "Maria Chen"
    date: "2026-03-10"
    status: "Decided"
  - id: "DEC-002"
    title: "Model architecture: fine-tuned transformer"
    description: "Select the ML architecture for ticket classification"
    options_considered: "Rule-based NLP, traditional ML (SVM/RF), fine-tuned transformer, LLM few-shot"
    decision: "Fine-tuned DistilBERT for classification with language-specific adapters"
    rationale: "Best accuracy/latency trade-off; adapter approach enables multilingual without full retraining"
    maker: "James Okafor"
    date: "2026-04-04"
    status: "Decided"
  - id: "DEC-003"
    title: "Confidence threshold for auto-routing"
    description: "Set the confidence threshold below which tickets require human review"
    options_considered: "0.7, 0.8, 0.9, dynamic threshold"
    decision: "0.8 confidence threshold for auto-routing P3/P4 tickets"
    rationale: "0.8 balances automation rate (~65% of P3/P4) with acceptable error rate based on historical analysis"
    maker: "James Okafor"
    date: "2026-04-18"
    status: "Decided"
  - id: "DEC-004"
    title: "PII masking approach"
    description: "Choose the PII handling strategy for training data"
    options_considered: "Regex-based masking, NER-based masking, differential privacy, data synthesis"
    decision: "NER-based PII masking with regex fallback for structured fields (emails, phone numbers)"
    rationale: "NER catches contextual PII that regex misses; regex handles structured patterns reliably"
    maker: "Priya Sharma"
    date: "2026-03-25"
    status: "Decided"
  - id: "DEC-005"
    title: "Explainability UI: top contributing phrases"
    description: "Choose the explainability method for the agent-facing dashboard"
    options_considered: "SHAP values, LIME, attention visualization, top contributing phrases"
    decision: "Show top 3 contributing phrases with confidence bar"
    rationale: "Agents need quick, actionable context; attention-highlighted phrases are more interpretable than numeric scores"
    maker: "Aisha Patel"
    date: "2026-04-22"
    status: "Decided"
  - id: "DEC-006"
    title: "Rollout strategy: staged opt-in"
    description: "Define the production rollout approach"
    options_considered: "Big bang, A/B test, staged rollout, shadow mode first"
    decision: "Shadow mode (2 weeks) → opt-in pilot (volunteer agents) → canary (10%) → full rollout"
    rationale: "Shadow mode validates accuracy without impacting agents; staged rollout limits blast radius"
    maker: "Maria Chen"
    date: "2026-04-25"
    status: "Decided"
  - id: "DEC-007"
    title: "Sprint cadence: 2-week sprints"
    description: "Set the sprint cadence for the build phase"
    options_considered: "1-week, 2-week, 3-week"
    decision: "2-week sprints aligned with framework default"
    rationale: "Matches team velocity and review cadence; 1-week too short for ML training cycles"
    maker: "Maria Chen"
    date: "2026-03-05"
    status: "Decided"
