# AI Project Leadership / Strategic Update Deck — Template Schema
# Keys map to {{Lead_*}} placeholder tokens in the Google Slides template.
# Auto-population reads this YAML -> generates Slides API batchUpdate requests.
#
# ============================================================================
# KEY MAPPING: yaml_key -> {{Slides Placeholder}}
# ============================================================================
#
# TITLE SLIDE
#   metadata.project_name                        -> {{Lead_Project_Name}}
#   (derived or manually set)                    -> {{Lead_Report_Period}}
#   project_health.summary                       -> {{Lead_Executive_Summary}}
#   metadata.authors.pm                          -> {{Lead_PM_Name}}
#   (current date)                               -> {{Lead_Report_Date}}
#
# PROJECT HEALTH DASHBOARD (Slide 2)
#   project_health.rag_status                    -> {{Lead_RAG_Status}}
#   project_health.current_phase                 -> {{Lead_Current_Phase}}
#   (derived from timeline[phase=N])             -> {{Lead_Current_Phase_Name}}
#   project_health.summary                       -> {{Lead_Health_Summary}}
#   (derived count: open risks)                  -> {{Lead_Active_Risk_Count}}
#   (derived count: escalations)                 -> {{Lead_Open_Escalation_Count}}
#
# BUSINESS ALIGNMENT (Slide 3)
#   (manual or derived from problem_statement)   -> {{Lead_Problem_Summary}}
#   (manual summary of AI approach)              -> {{Lead_AI_Solution}}
#   success_metrics.business[]                   -> Business metrics table
#
# PHASE GATE STATUS (Slide 4)
#   phase_gates[]                                -> Phase gate table (cell population)
#
# KEY DECISIONS & ESCALATIONS (Slide 5)
#   (derived count)                              -> {{Lead_Escalation_Count}}
#   escalations[]                                -> Escalation table (cell population)
#
# RESOURCE & BUDGET (Slide 6)
#   budget.planned                               -> {{Lead_Budget_Planned}}
#   budget.actual                                -> {{Lead_Budget_Actual}}
#   budget.forecast                              -> {{Lead_Budget_Forecast}}
#   budget.currency                              -> {{Lead_Budget_Currency}}
#   (derived: actual - planned)                  -> {{Lead_Budget_Variance}}
#   budget.notes                                 -> {{Lead_Budget_Notes}}
#   roles[]                                      -> Team table (cell population)
#
# TIMELINE & MILESTONES (Slide 7)
#   timeline[] + milestones[]                    -> Timeline table (cell population)
#
# RESPONSIBLE AI STATUS (Slide 8)
#   (derived from responsible_ai + phase_gates)  -> {{Lead_RAI_Summary}}
#   responsible_ai.*                             -> RAI areas table (cell population)
#
# APPENDIX (Slide 9)
#   metadata.document_ids.kickoff                -> {{Lead_Kickoff_Link}}
#   metadata.document_ids.requirements           -> {{Lead_Requirements_Link}}
#   metadata.document_ids.tracking               -> {{Lead_Tracking_Link}}
#   metadata.document_ids.eng_review             -> {{Lead_Eng_Review_Link}}
#
# ============================================================================

---
metadata:
  project_name: ""
  framework: "AI Project Model (Google PAIR-Aligned)"
  authors:
    pm: ""
    tech_lead: ""
    additional: []
  document_ids:
    kickoff: ""                    # Google Docs ID
    requirements: ""               # Google Docs ID
    tracking: ""                   # Google Sheets ID
    eng_review: ""                 # Google Slides ID
    leadership_review: ""          # Google Slides ID (this artifact)
  presentation_id: ""             # Google Slides ID once created (alias for document_ids.leadership_review)

# ---------------------------------------------------------------------------
# Project Health (A5 primary data source)
# ---------------------------------------------------------------------------
project_health:
  rag_status: ""                   # R | A | G (Red / Amber / Green)
  current_phase: 1                 # Active phase (1-6)
  summary: ""                      # 1-3 sentence executive summary

# ---------------------------------------------------------------------------
# Report Configuration
# ---------------------------------------------------------------------------
report_period: ""                  # e.g., "March 2026" or "Phase 3 Gate Review"
problem_summary: ""                # Executive-level problem statement (1-2 sentences)
ai_solution_summary: ""            # Executive-level solution description (1-2 sentences)

# ---------------------------------------------------------------------------
# Escalations (A5 primary data source)
# ---------------------------------------------------------------------------
escalations:
  - id: ""                         # Escalation ID (e.g., ESC-001)
    description: ""                # What needs leadership attention
    decision_needed: ""            # What decision is being requested
    deadline: ""                   # YYYY-MM-DD
    audience: ""                   # Who needs to decide (Director, VP, etc.)

# ---------------------------------------------------------------------------
# Budget (A5 primary data source)
# ---------------------------------------------------------------------------
budget:
  planned: 0                      # Planned total spend
  actual: 0                       # Actual spend to date
  forecast: 0                     # Projected total at completion
  currency: "USD"                 # Currency code
  notes: ""                       # Budget context or caveats

# ---------------------------------------------------------------------------
# Shared Sections (referenced from project.yaml)
# ---------------------------------------------------------------------------

success_metrics:
  technical:
    - id: ""
      metric: ""
      threshold: ""
      action_if_breached: ""
  human_centered:
    - id: ""
      metric: ""
      threshold: ""
      action_if_breached: ""
  business:
    - id: ""
      metric: ""
      threshold: ""
      action_if_breached: ""

roles:
  - role: ""
    name: ""
    responsibility: ""
    phase_coverage: ""

phase_gates:
  - phase: 1
    description: ""
    owner: ""
    status: "pending"              # pending | passed | blocked
    date: ""                       # Date gate was passed
    criteria:
      - id: ""
        description: ""
        completed: false

milestones:
  - id: ""
    phase: 1
    description: ""
    owner: ""
    due_date: ""
    status: ""                     # not_started | in_progress | completed | blocked
    dependencies: []

timeline:
  - phase: 1
    description: ""
    target_start: ""               # YYYY-MM-DD
    target_end: ""                 # YYYY-MM-DD
    gate_owner: ""

responsible_ai:
  who_could_be_harmed: []          # Array of bullet items
  bias_risks: []
  privacy_pii: []
  fairness: []
  transparency: []

risks:
  - risk_id: ""
    description: ""
    likelihood: ""                 # H | M | L
    impact: ""                     # H | M | L
    mitigation: ""
    owner: ""
    status: "open"                 # open | mitigated | closed
    review_date: ""
