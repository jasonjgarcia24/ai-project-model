# This example combines all data from the per-artifact Support Ticket Triage
# examples into a single unified project.yaml. Shared sections appear once;
# artifact-specific sections contain the data each skill consumes.
#
# Source examples merged:
#   - kickoff_example_support_triage.yaml
#   - requirements_example_support_triage.yaml
#   - tracking_example_support_triage.yaml
#   - eng_review_example_support_triage.yaml
#   - leadership_review_example_support_triage.yaml
#
# ==============================================================================

---

# ============================================================================
# METADATA
# ============================================================================
metadata:
  project_name: "AI-Powered Support Ticket Triage"
  framework: "AI Project Model (Google PAIR-Aligned)"
  authors:
    pm: "Maria Chen"
    tech_lead: "James Okafor"
    additional: ["Priya Sharma"]
  status: "Draft"
  date: "2026-02-24"
  document_ids:
    kickoff: "15GYfXG6VLb2RjxFKmXisOKGPtaXey6FVlyywS1yphEI"
    requirements: "1abc2def3ghi4jkl5mno6pqr"
    tracking: "1xyz7890abcdef1234567890"
    eng_review: "1eng9876review5432deck10"
    leadership_review: ""

# ============================================================================
# PROBLEM STATEMENT
# ============================================================================
problem_statement:
  target_user: "Customer support agents handling 2,000+ tickets/day across 5 product lines"
  problem_description: "Agents spend ~35% of their time manually reading and routing tickets to the correct specialist queue. Misroutes account for 18% of tickets, adding 4+ hours to average resolution time."
  current_state: "Tickets are triaged manually by L1 agents using a static decision tree. The tree has not been updated in 14 months and does not account for 2 new product lines."
  desired_outcome: "Tickets are auto-classified by priority (P1-P4) and routed to the correct specialist queue within seconds of submission, with agents retaining override capability."

# ============================================================================
# AI JUSTIFICATION
# ============================================================================
ai_justification:
  ai_vs_rule_based:
    solvable_with_rules: false
    explanation: "The existing rule-based decision tree covers only 3 of 5 product lines and fails on multi-issue tickets, tickets with ambiguous language, and non-English submissions."
    why_ai_warranted: "Ticket language is highly variable (slang, typos, multiple languages). Pattern complexity and volume (2,000+/day) exceed what static rules can handle reliably."
  automation_vs_augmentation:
    approach: "human_in_the_loop"
    rationale: "P1/P2 tickets carry high business risk. The model will suggest classification and routing, but agents review and confirm before dispatch. P3/P4 tickets auto-route with a confidence threshold."

# ============================================================================
# SUCCESS METRICS
# ============================================================================
success_metrics:
  technical:
    - id: "T1"
      metric: "Classification accuracy (top-1)"
      threshold: ">= 92%"
      action_if_breached: "Retrain with expanded labeled dataset; review misclassified categories"
    - id: "T2"
      metric: "Inference latency (P95)"
      threshold: "< 500ms"
      action_if_breached: "Optimize model serving; evaluate model distillation"
  human_centered:
    - id: "H1"
      metric: "Agent override rate"
      threshold: "<= 15%"
      action_if_breached: "Conduct agent interviews to identify systematic misclassifications"
    - id: "H2"
      metric: "Agent trust score (quarterly survey)"
      threshold: ">= 4.0 / 5.0"
      action_if_breached: "Improve explanation UI; increase transparency on model reasoning"
  business:
    - id: "B1"
      metric: "Misroute rate"
      threshold: "<= 5% (down from 18%)"
      action_if_breached: "Audit routing logic; expand training data for problem categories"
    - id: "B2"
      metric: "Average time-to-resolution"
      threshold: ">= 25% reduction"
      action_if_breached: "Investigate bottlenecks beyond triage (e.g., specialist capacity)"

