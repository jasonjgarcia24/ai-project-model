# ============================================================================
# REQUIREMENTS
# ============================================================================
requirements:
  functional:
    - id: "FR-001"
      requirement: "System shall classify incoming tickets into one of 12 product-specific queues"
      priority: "P0"
      phase: "4"
      acceptance_criteria: "Classification accuracy >= 92% on held-out test set across all 12 queues"
    - id: "FR-002"
      requirement: "System shall assign priority level (P1-P4) to each ticket based on content analysis"
      priority: "P0"
      phase: "4"
      acceptance_criteria: "P1 tickets correctly identified >= 98% of the time (recall); P1 misclassification rate < 0.5%"
    - id: "FR-003"
      requirement: "P1/P2 tickets shall require agent confirmation before routing"
      priority: "P0"
      phase: "4"
      acceptance_criteria: "Agent confirmation UI loads within 2s; no P1/P2 ticket auto-routes without agent action"
    - id: "FR-004"
      requirement: "Agents shall be able to override model classification and routing"
      priority: "P0"
      phase: "3"
      acceptance_criteria: "Override action completes in <= 3 clicks; override is logged with reason code"
    - id: "FR-005"
      requirement: "System shall display confidence score and top 3 contributing phrases for each classification"
      priority: "P1"
      phase: "3"
      acceptance_criteria: "Confidence score displayed as categorical (High/Medium/Low); phrases highlighted in ticket text"
    - id: "FR-006"
      requirement: "System shall support multilingual ticket classification (EN, ES, PT, ZH, JA)"
      priority: "P1"
      phase: "4"
      acceptance_criteria: "Per-language accuracy within 5 percentage points of English baseline"
    - id: "FR-007"
      requirement: "System shall fall back to manual triage when confidence is below threshold"
      priority: "P0"
      phase: "4"
      acceptance_criteria: "Tickets with confidence < 0.7 are routed to manual queue; fallback rate monitored"
    - id: "FR-008"
      requirement: "System shall provide weekly classification performance reports per queue"
      priority: "P2"
      phase: "5"
      acceptance_criteria: "Report includes accuracy, override rate, and average routing time per queue"

  data:
    - id: "DR-001"
      dataset_name: "Historical Support Tickets (24 months)"
      source: "Zendesk export via API"
      format: "JSON (ticket objects with metadata)"
      size_estimate: "~1.4M tickets, 12 GB"
      pii_handling: "PII masked via regex + NER pipeline before model training; original data remains in Zendesk"
      labeling_strategy: "Existing queue assignments as labels; 5,000 tickets relabeled by SMEs for quality baseline"
      data_card_ref: "TBD — Data Card to be produced in Phase 2"
    - id: "DR-002"
      dataset_name: "Product Taxonomy v3"
      source: "Internal product management database"
      format: "CSV (product hierarchy with descriptions)"
      size_estimate: "~500 rows"
      pii_handling: "No PII — product metadata only"
      labeling_strategy: "N/A — reference data"
      data_card_ref: "N/A"
    - id: "DR-003"
      dataset_name: "Multilingual Ticket Subset"
      source: "Zendesk export (filtered by language tag)"
      format: "JSON"
      size_estimate: "~180K tickets across ES, PT, ZH, JA"
      pii_handling: "Same masking pipeline as DR-001"
      labeling_strategy: "Native-speaking SMEs label 2,000 tickets per language for evaluation set"
      data_card_ref: "TBD — Data Card to be produced in Phase 2"

  model:
    - id: "MR-001"
      constraint: "Model must serve predictions within 500ms P95 latency on standard API infrastructure"
      baseline: "Rule-based decision tree: 74% accuracy, 18% misroute rate"
      compute_budget: "Max 2 GPU-hours/day for inference; training budget: 200 GPU-hours total"
    - id: "MR-002"
      constraint: "Model must support incremental retraining without full dataset reprocessing"
      baseline: "N/A — current system has no ML component"
      compute_budget: "Retraining cost < $500/run; weekly retraining cadence"
    - id: "MR-003"
      constraint: "Model size must fit within existing Kubernetes cluster resource limits (8GB RAM per pod)"
      baseline: "N/A"
      compute_budget: "No additional infrastructure procurement for inference"

  design:
    explainability:
      type: "specific_output"
      confidence_display: "categorical"
      content: "For each ticket, agents see the predicted queue, a High/Medium/Low confidence indicator, and the top 3 phrases from the ticket text that most influenced the classification"
    user_controls:
      - "Override: Agents can change the suggested queue and priority with a reason code dropdown"
      - "Undo: Agents can revert a routing decision within 5 minutes of confirmation"
      - "Opt-out: Team leads can disable AI triage for specific queues during incidents"
      - "Feedback: Agents can flag incorrect classifications with a single click; flagged tickets feed into retraining"
      - "Automation phasing: Week 1-2 preview mode (suggestions only), Week 3-4 assist mode (auto-route P3/P4), Week 5+ full mode"
    onboarding:
      - "Pre-launch training session (45 min) covering: what the model does, what it does NOT do, how to override"
      - "In-app tooltip on first use: 'AI suggests a queue based on ticket content. You always have the final say.'"
      - "Weekly digest email showing team accuracy and override patterns to build shared understanding"
    error_handling:
      - "Context errors: When ticket language is ambiguous, show lower confidence and suggest 2 alternative queues"
      - "Failstates: If model service is unavailable, tickets fall back to manual triage with no agent-visible error"
      - "Background errors: Nightly batch job compares model predictions against final ticket resolutions; drift alerts at > 3% accuracy drop"
      - "Recovery flows: Misrouted tickets are flagged by receiving agents; auto-reroute with model update within 24 hours"

  privacy:
    pii_inventory:
      - "Customer names and email addresses in ticket text — masked via NER before training"
      - "Account IDs in ticket metadata — hashed and stored in secure pipeline"
      - "Free-text ticket content may contain sensitive personal details — redacted before model ingestion"
    retention_policy: "Raw tickets retained in Zendesk per existing 36-month retention policy. Training datasets (PII-masked) retained for model reproducibility for 24 months after model retirement."
    data_rights: "Customers can request ticket deletion via existing privacy portal. Deletion propagates to training pipeline within 30 days. Model retraining excludes deleted records."
    consent_model: "Support ticket submission constitutes implicit consent for service delivery. AI-assisted routing disclosed in updated Terms of Service. No additional consent required for internal operational use."

  compliance:
    - id: "COMP-001"
      regulation: "GDPR"
      requirement: "Right to explanation for automated decisions affecting individuals"
      how_addressed: "Human-in-the-loop for P1/P2 decisions ensures no fully automated high-impact decisions. Confidence scores and contributing phrases provide explanation for agent review."
      owner: "James Okafor"
      status: "pending"
    - id: "COMP-002"
      regulation: "SOC2"
      requirement: "Data access controls and audit logging"
      how_addressed: "Training data access restricted to ML team via IAM roles. All model predictions logged with timestamp, input hash, and output for audit trail."
      owner: "Priya Sharma"
      status: "pending"
    - id: "COMP-003"
      regulation: "Internal Data Policy"
      requirement: "PII must not be stored in ML model artifacts"
      how_addressed: "PII masking pipeline runs before any data enters the ML pipeline. Model weights and embeddings contain no recoverable PII."
      owner: "Priya Sharma"
      status: "in_progress"

  safety:
    boundaries:
      - "The system will NOT auto-route P1 (critical) tickets without agent confirmation"
      - "The system will NOT access or modify customer account data"
      - "The system will NOT respond to customers directly — it only assists internal agents"
      - "The system will NOT make escalation decisions (L1 to L2 transfers require agent judgment)"
    confidence_thresholds: "Predictions with confidence < 0.7 are routed to manual triage queue. Predictions between 0.7-0.85 are auto-routed for P3/P4 only. Predictions >= 0.85 are auto-routed for P3/P4 and suggested with high confidence for P1/P2."
    human_override: "Agents can override any classification at any time. Overrides are logged and used as training signals. Team leads can disable AI routing per-queue via admin panel."
    monitoring_strategy: "Real-time dashboard tracking: accuracy by queue, override rate, fallback rate, latency. Daily drift detection comparing prediction distribution to historical baseline. Weekly review by Tech Lead; monthly review by PM and Eng Lead."

  rai:
    - id: "RAI-001"
      requirement: "Classification accuracy must not vary by more than 5 percentage points across supported languages"
      audit_plan: "Per-language accuracy evaluation on held-out test set at each model release. Results reviewed by RAI Reviewer before deployment."
      phase: "4-5"
    - id: "RAI-002"
      requirement: "Misroute rate must not disproportionately affect any customer segment"
      audit_plan: "Quarterly fairness audit: misroute rate segmented by customer region, language, and product line. Disparities > 3% trigger investigation."
      phase: "5-6"
    - id: "RAI-003"
      requirement: "No PII shall be present in model training data or artifacts"
      audit_plan: "Automated PII scan of training data before each training run. Spot-check of 500 random training examples per quarter."
      phase: "2-6"
    - id: "RAI-004"
      requirement: "Agent performance metrics shall not be negatively impacted by model errors"
      audit_plan: "Pre/post comparison of agent performance metrics (CSAT, tickets/hour, escalation rate). Review with Support leadership at Phase 5 gate."
      phase: "5"

  dependencies:
    - id: "DEP-001"
      description: "Zendesk API access for historical ticket export (24 months)"
      type: "internal"
      owner: "Priya Sharma"
      status: "open"
    - id: "DEP-002"
      description: "Product taxonomy v3 sign-off from Product Management"
      type: "internal"
      owner: "Maria Chen"
      status: "open"
    - id: "DEP-003"
      description: "Native-speaking SMEs for multilingual labeling (ES, PT, ZH, JA)"
      type: "external"
      owner: "Maria Chen"
      status: "open"
    - id: "DEP-004"
      description: "Kubernetes cluster capacity for model serving pods"
      type: "internal"
      owner: "James Okafor"
      status: "resolved"
    - id: "DEP-005"
      description: "Updated Terms of Service disclosing AI-assisted routing"
      type: "internal"
      owner: "Carlos Rivera"
      status: "open"

