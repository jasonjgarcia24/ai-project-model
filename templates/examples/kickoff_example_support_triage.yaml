responsible_ai:
  who_could_be_harmed:
    - "Customers whose tickets are deprioritized due to language bias (non-English speakers, customers using informal language)"
    - "Support agents whose performance metrics may be affected by model errors"
  bias_risks:
    - "Training data skewed toward English-language tickets from US customers"
    - "Underrepresentation of APAC and LATAM product issues"
  privacy_pii:
    - "Tickets contain customer names, email addresses, and potentially account details"
    - "PII must be masked before model training"
    - "No PII stored in model artifacts"
  fairness:
    - "Classification accuracy will be evaluated per-language and per-product line to ensure equitable service"
    - "Disparate misroute rates across customer segments will trigger review"
  transparency:
    - "Agents will see the model's suggested category, confidence score, and top contributing phrases"
    - "Customers will not interact with the model directly"

risks:
  - risk_id: "R-001"
    description: "Insufficient labeled training data for new product lines"
    likelihood: "M"
    impact: "H"
    mitigation: "Prioritize labeling for new product lines in Phase 2; engage domain SMEs for label review"
    owner: "Priya Sharma"
  - risk_id: "R-002"
    description: "Language bias leading to lower accuracy for non-English tickets"
    likelihood: "H"
    impact: "H"
    mitigation: "Stratified evaluation by language; multilingual training data augmentation; Facets audit"
    owner: "David Kim"
  - risk_id: "R-003"
    description: "Agent resistance to AI-assisted triage"
    likelihood: "M"
    impact: "M"
    mitigation: "Early agent involvement in design (Phase 3); pilot with volunteer team; transparent override metrics"
    owner: "Aisha Patel"
  - risk_id: "R-004"
    description: "P1 ticket misclassification causing delayed response to critical issues"
    likelihood: "L"
    impact: "H"
    mitigation: "P1/P2 tickets require human confirmation; fallback to manual triage if confidence < 0.8"
    owner: "James Okafor"

