responsible_ai:
  who_could_be_harmed:
    - "Customers whose tickets are deprioritized due to language bias (non-English speakers, customers using informal language)"
    - "Support agents whose performance metrics may be affected by model errors"
  bias_risks:
    - "Training data skewed toward English-language tickets from US customers"
    - "Underrepresentation of APAC and LATAM product issues"
  privacy_pii:
    - "Tickets contain customer names, email addresses, and potentially account details"
    - "PII must be masked before model training"
    - "No PII stored in model artifacts"
  fairness:
    - "Classification accuracy will be evaluated per-language and per-product line to ensure equitable service"
    - "Disparate misroute rates across customer segments will trigger review"
  transparency:
    - "Agents will see the model's suggested category, confidence score, and top contributing phrases"
    - "Customers will not interact with the model directly"

