responsible_ai:
  who_could_be_harmed:
    - "PMs who rely on AI-generated problem statements or risk narratives without sufficient review — inaccurate framing could misalign teams"
    - "Stakeholders who receive leadership decks with AI-generated summaries that oversimplify or misrepresent project status"
    - "Teams working on non-standard AI projects where a one-size-fits-all framework may not capture unique requirements"
  bias_risks:
    - "Framework design reflects PAIR Guidebook conventions which are optimized for consumer-facing AI products — may underserve infrastructure, research, or internal-tool AI projects"
    - "AI-generated problem statements may adopt a solution-oriented framing bias, understating problem complexity"
  privacy_pii:
    - "YAML files may contain personnel names, email addresses, and project details"
    - "Google Doc/Sheets/Slides artifacts are stored in the user's Google Workspace — access governed by their org policies"
    - "No project data is sent to external services beyond Google APIs and Claude Code"
  fairness:
    - "Framework templates will be tested across multiple project types (consumer AI, internal tooling, data infrastructure) to ensure broad applicability"
    - "YAML schema will support optional sections so teams can skip irrelevant fields without penalty"
  transparency:
    - "All AI-generated content (problem statements, narratives) is clearly labeled in the skill workflow — PM reviews before insertion"
    - "Claude Code skills are open-source and inspectable in the project repo"

risks:
  - risk_id: "R-001"
    description: "Google Docs/Sheets/Slides API breaking changes or rate limits disrupt artifact generation"
    likelihood: "L"
    impact: "H"
    mitigation: "Pin API versions; implement retry with backoff; maintain offline YAML as source of truth"
    owner: "Sarah Mitchell"
  - risk_id: "R-002"
    description: "Template formatting degradation from API-based text insertion and table manipulation"
    likelihood: "M"
    impact: "M"
    mitigation: "Use copy-and-replace pattern (never generate from scratch); test formatting after each batch update"
    owner: "Diana Lee"
  - risk_id: "R-003"
    description: "Shared YAML schema becomes too complex as artifacts are added, reducing PM usability"
    likelihood: "M"
    impact: "H"
    mitigation: "Design YAML with sensible defaults and optional sections; add validation with clear error messages; consider guided input mode post-MVP"
    owner: "Jason Garcia"
  - risk_id: "R-004"
    description: "Scope creep into portfolio management or external tool integrations before MVP is complete"
    likelihood: "H"
    impact: "M"
    mitigation: "Enforce MVP scope (single project, Google Workspace only); track scope requests in decision log for v2 consideration"
    owner: "Jason Garcia"

