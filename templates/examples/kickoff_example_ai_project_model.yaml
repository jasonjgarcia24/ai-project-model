metadata:
  project_name: "AI Project Model — PM Workflow Framework"
  framework: "AI Project Model (Google PAIR-Aligned)"
  authors:
    pm: "Jason Garcia"
    tech_lead: "Sarah Mitchell"
    additional: ["Ryan Torres"]
  status: "Draft"
  date: "2026-02-25"
  document_id: ""

problem_statement:
  target_user: "PMs and engineers managing AI product development from discovery through post-launch"
  problem_description: "AI projects require specialized artifacts (data governance docs, RAI checklists, model evaluation reports) that generic PM frameworks do not address. PMs create documents from scratch each cycle, leading to inconsistent quality, missed responsible AI checkpoints, and 40%+ of planning time spent on boilerplate rather than substance."
  current_state: "Teams use ad-hoc templates or adapt generic PM frameworks (Agile, SDLC) that lack AI-specific concerns — data provenance, bias auditing, explainability design, and phased automation. There is no structured handoff between project phases, and artifacts are not connected (roles re-entered, metrics redefined, risks duplicated across documents)."
  desired_outcome: "A PM fills out a single structured YAML file and generates all project artifacts — kick-off doc, requirements definition, milestone tracker, and review decks — with data flowing between artifacts, PAIR best practices embedded, and phase gates enforced."

ai_justification:
  ai_vs_rule_based:
    solvable_with_rules: false
    explanation: "Template population (find-and-replace) is rule-based, but several workflow steps require AI: generating cohesive problem statement paragraphs from structured context, adapting content framing for different audiences (engineering vs. leadership), and validating artifact completeness against the PAIR framework."
    why_ai_warranted: "Natural language generation for problem statements and narrative sections, context-aware content adaptation across artifact types, and intelligent validation of framework compliance exceed what static templates can deliver."
  automation_vs_augmentation:
    approach: "hybrid"
    rationale: "Structural population (placeholder replacement, table insertion, chart generation) is fully automated. Content generation (problem statements, risk narratives) is AI-augmented with PM review before insertion. PMs retain full control over YAML input and can override any generated content."

success_metrics:
  technical:
    - id: "T1"
      metric: "Placeholder replacement accuracy"
      threshold: "100% (zero missed placeholders per artifact)"
      action_if_breached: "Audit placeholder mapping; fix YAML schema or template mismatches"
    - id: "T2"
      metric: "Skill execution success rate"
      threshold: ">= 95% across all artifacts"
      action_if_breached: "Review error logs; add retry logic or improve API error handling"
  human_centered:
    - id: "H1"
      metric: "Time to generate full artifact set vs. manual creation"
      threshold: ">= 75% reduction"
      action_if_breached: "Profile bottlenecks in skill workflow; optimize API call batching"
    - id: "H2"
      metric: "PM satisfaction score (usability survey)"
      threshold: ">= 4.0 / 5.0"
      action_if_breached: "Conduct PM interviews; simplify YAML schema or add guided input mode"
  business:
    - id: "B1"
      metric: "Artifact consistency (cross-artifact data match rate)"
      threshold: ">= 98% (roles, metrics, timeline match across all docs)"
      action_if_breached: "Audit shared YAML data flow; fix cross-artifact population logic"
    - id: "B2"
      metric: "Framework adoption (projects using full artifact set)"
      threshold: ">= 3 projects in first quarter post-launch"
      action_if_breached: "Gather user feedback; reduce onboarding friction; add project-init wizard"

